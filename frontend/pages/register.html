<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fella - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Fella</h1>
            <p>Tạo tài khoản mới để trải nghiệm</p>
        </div>

        <div id="alertBox" class="alert-message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="full_name">Họ và tên</label>
                <input type="text" id="full_name" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="username">Tên người dùng (Username)</label>
                <input type="text" id="username" placeholder="Ví dụ: nguyenvana" required>
            </div>

            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn-primary">Đăng ký</button>
        </form>

        <div class="auth-footer">
            <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
